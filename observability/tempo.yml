server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

query_frontend:
  search:
    query_ingesters_until: 1h

ingester:
  trace_idle_period: 2s
  flush_check_period: 1s
  max_block_duration: 1m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
      ingestion_time_range_slack: 30m
    local:
      path: /tmp/tempo/blocks
