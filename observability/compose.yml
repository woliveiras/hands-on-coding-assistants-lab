name: hands-on-coding-assistants-observability

services:
  grafana:
    image: grafana/grafana:12.4.15
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: utc
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${TASK_API_GRAFANA_PORT:-3300}:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
      - tempo

  loki:
    image: grafana/loki:3.7.10
    command: [-config.file=/etc/loki/local-config.yaml]

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  tempo:
    image: grafana/tempo:2.10.10
    command: [-config.file=/etc/tempo.yml]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro

  simulator:
    image: node:24.22.3-alpine
    command: [node, simulator.mjs]
    working_dir: /lab/observability
    volumes:
      - ./:/lab/observability:ro
      - ../src:/lab/src:ro
    init: true
    depends_on:
      - loki
      - prometheus
      - tempo
