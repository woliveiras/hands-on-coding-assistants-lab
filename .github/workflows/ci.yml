name: CI
on: pull_request
permissions:
  contents: read
jobs:
  verify:
    name: verify (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify tests and coverage policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/coverage.mjs --base "$BASE_SHA"
